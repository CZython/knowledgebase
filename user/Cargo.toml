# kb-user — the full CLI (default build)
#
# A thin wrapper around the shared CLI body at `../kb/main.rs`:
#   - enables both `editor` and `tui` features;
#   - depends on ratatui + crossterm (the TUI-only crates);
#   - exposes binary `kb-user`.
#
# The shared body is NOT a package of its own (no Cargo.toml in `kb/`);
# it is included via `include!` from this one-line `src/main.rs`. Because
# features are package-global, both variants (user / hardened) need to live
# in separate packages that share the same body file. See HARDENED_BUILD.md.
[package]
name = "user"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["editor", "tui"]
editor = []
tui = ["dep:ratatui", "dep:crossterm"]

[[bin]]
name = "kb-user"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
kb-core = { path = "../kb-core" }
kb-db   = { path = "../kb-db" }
dirs    = { workspace = true }
# The CLI writes SQL directly against `Db.conn` (a `rusqlite::Connection`),
# so it needs the crate for `params!` / `OptionalExtension` / the FTS5
# `snippet`/`bm25` functions — matching `kb-db`'s own dep (same bundled
# build, one SQLite in the tree).
rusqlite = { workspace = true }
# M8 — the TUI shell (assumed, like clap/rusqlite). Only the `kb` binary
# links these; `kb-core` + `kb-db` stay TUI-free so the verified/assumed
# boundary stays visible in the crate graph (PLAN §9/§10).
# Optional + feature-gated behind `tui` (see [features]): a hardened
# build strips the whole TUI surface and these deps from the tree.
ratatui   = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }