[workspace]
# Three crates — one verified core, one DB shell, one CLI:
#
#   kb-core     pure Rust + Verus (no std IO) — the *proven* logic
#   kb-db       rusqlite + FTS5 — the *assumed* shell (FFI/SQL)
#   kb-user     full CLI binary `kb` (clap) — TUI + editor + all verbs
#   kb-hardened headless CLI binary `kb-hardened` — same body, tui+editor off
#
# `kb/` is the *shared CLI source* (the one real body: main.rs/diff.rs/tui),
# compiled into both the `kb-user` and `kb-hardened` packages via `include!`.
# It is NOT a workspace member (no Cargo.toml). We deliberately separate
# "proven" (kb-core) and "assumed" (kb-db + the shell) so that boundary is
# visible in the crate graph. See PLAN.md §9/§10 and HARDENED_BUILD.md.
resolver = "2"
members = ["kb-core", "kb-db", "kb-user", "kb-hardened"]

# Shared lint levels, inherited by every crate (PLAN §9/§10: the whole tree
# is `unsafe`-free — no `unsafe` in kb-core, kb-db, the CLI body, or any
# workspace member). `forbid` makes it a hard *error* across the entire
# project, so a future `unsafe` block (a TUI-backend FFI fix, a raw-pointer
# shortcut) is a compile error in *any* crate unless someone deliberately
# opts out with `#[allow(unsafe_code)]` + a reason. Single source of truth —
# each member inherits this, rather than carrying its own copy.
[workspace.lints.rust]
unsafe_code = "forbid"
# The `verus_only` cfg is turned on by Verus during verification; rustc will
# warn about the unknown cfg otherwise. Mirrors the scaffold the Verus
# toolchain generates (see `cargo verus new --lib out`). Required in the
# workspace so kb-core's `[lints.rust]` can inherit it via `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Minimum cargo/rustc; matches `rust-toolchain.toml`. Kept honest so
# `cargo publish` / docs.rs state the true floor.
rust-version = "1.98.1"
# Fallback description (each binary package overrides this below).
description = "kb — a single-binary Markdown knowledge base over SQLite + FTS5, with a Verus-verified zero-dependency core"

[profile.release]
# For a CLI we ship as a single binary (`cargo install` + the prebuilt
# per-platform artifacts), the release build is the product. Fat LTO +
# single codegen unit inlines across the whole crate graph (kb-core/kb-db/
# shell) and strips the bulk of what a default `-O3` leaves behind;
# `panic = "abort"` drops the unwind tables (we never unwind out of `main`;
# the TUI restores the terminal on a panic before unwinding). Smaller and
# faster, at the cost of a one-time full relink on every change — fine since
# release builds are deliberate.
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
# --- Intra-project crates (path + version). The version is what `cargo
# publish` / docs.rs need (path is stripped on publish); the path is what
# the workspace build uses. Listed here once instead of repeating in each
# member's [dependencies]. ---
kb-core = { path = "kb-core", version = "0.1.0" }
kb-db   = { path = "kb-db",   version = "0.1.0" }

# --- Verus core ---
# Exact pin: this machine's Verus (v0.2026.09.06 ARIA fork at
# ~/.local/bin/verus) was built against vstd 0.0.0-2026-09-06-0133.
# A `=` pin prevents cargo from drifting to a newer vstd whose
# metadata won't match what Verus expects.
vstd = "=0.0.0-2026-09-06-0133"

# --- SQLite (rusqlite + bundled SQLite C) ---
# `bundled` compiles SQLite from source (needs a C compiler — probed at
# M0. See §13.1). Avoids a system-wide libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }

# --- CLI ---
clap = { version = "4.5", features = ["derive"] }
# Shell-completion generator (`kb complete bash|zsh`). Pulled in only by
# `kb-user` under its `completions` feature (on by default there, off in
# `kb-hardened`) — same split as the TUI crates.
clap_complete = "4.6"

# --- XDG dirs (for ~/.local/share/knowledgebase/kb.db) ---
dirs = "5"

# --- TUI (M8) ---
# ratatui = the renderer (pure-Rust, terminal-agnostic, zero C deps);
# crossterm = the cross-platform terminal backend (raw mode + event loop).
# Both are *assumed* shells (M8.0): the proven frontmatter-edit +
# corpus-list logic they wrap is already in `kb-core` + `kb-db`. Versions
# pinned to what is cached offline on this box (see `~/.cargo/registry`).
ratatui  = "0.29"
crossterm = "0.28"
# Display-width (cell) measurement for the TUI's bounded list rows —
# ratatui/unicode internals already compile it; we use it directly to
# truncate to *cells* so CJK/fullwidth titles don't blow past the edge.
unicode-width = "0.2"
# `--palette` file format + `StyleSpec` serde (P1): TOML is human-editable
# and `serde` gives us structured deserialization with `deny_unknown_fields`.
# Only `kb-user` links them, feature-gated behind `tui`, so a hardened build
# never pulls them into its dep tree.
serde = { version = "1", features = ["derive"] }
toml  = "0.8"
