[package]
name = "kb"
version.workspace = true
edition.workspace = true
license.workspace = true

# SECURITY_REPORT 3.1 mitigation (agreed): the `$VISUAL`/`$EDITOR`-forking
# verbs (`section edit`, and later `create -e`) are compiled in only when the
# `editor` feature is enabled. `editor` is on by default so day-to-day
# builds behave as they always have; a hardened build strips the entire
# editor attack surface at compile time:
#
#   cargo build -p kb --no-default-features    # no editor, no TUI
#   cargo build -p kb --features editor        # editor (explicit)
#
# Likewise `tui` (default on) compiles the interactive shell. It pulls the two
# TUI-only deps (ratatui/crossterm) via the `dep:` prefix so they stay hidden
# behind the feature; a hardened agent build (`--no-default-features`) drops
# the entire `kb tui` surface AND its deps from the dependency tree:
#
#   cargo build -p kb --features editor,tui    # everything (default)
[features]
default = ["editor", "tui"]
editor = []
tui = ["dep:ratatui", "dep:crossterm"]

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
kb-core = { path = "../kb-core" }
kb-db   = { path = "../kb-db" }
dirs    = { workspace = true }
# The CLI writes SQL directly against `Db.conn` (a `rusqlite::Connection`),
# so it needs the crate for `params!` / `OptionalExtension` / the FTS5
# `snippet`/`bm25` functions — matching `kb-db`'s own dep (same bundled
# build, one SQLite in the tree).
rusqlite = { workspace = true }
# M8 — the TUI shell (assumed, like clap/rusqlite). Only the `kb` binary
# links these; `kb-core` + `kb-db` stay TUI-free so the verified/assumed
# boundary stays visible in the crate graph (PLAN §9/§10).
# Optional + feature-gated behind `tui` (see [features]): a hardened
# build strips the whole TUI surface and these deps from the tree.
ratatui   = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
