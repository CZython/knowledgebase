# The *colorful* out-of-the-box default. White body text; magenta headings;
# cyan for the active field; green family for emphasis / gated / success;
# light-red for error; black-on-blue for the selection bar. This file is a
# user-editable *starting point* — `kb tui --palette default` reads the
# inline `default_palette()` in palette.rs, NOT this file (this file exists
# so a user can copy it to ~/.kb_config/default.toml and tweak colors).

[label]
fg   = "magenta"
bold = true

[default]
fg = "white"

[dim]
fg = "dark-gray"

[active]
fg   = "cyan"
bold = true

[caret]
fg   = "yellow"
bold = true

[hint]
fg = "green"

[gated]
fg   = "light-green"
bold = true                # ◆ (has search_required_phrase)

[open]
fg = "dark-gray"           # ◇ (no gate)

[info]
fg = "gray"

[success]
fg = "light-green"

[error]
fg = "light-red"           # the `!` glyph marks the severity (not just color)

[selection]
fg = "black"
bg = "blue"

[selection_ctx]
fg   = "green"
bold = true                # ▶ current item

[md_bold]
fg   = "light-yellow"
bold = true                # **bold** in the read pane

[md_italic]
fg     = "light-cyan"
italic = true              # *italic* / _italic_ in the read pane

[md_strike]
fg            = "dark-gray"
strikethrough = true       # ~~strikethrough~~ in the read pane

[md_code]
fg = "white"               # `code` in the read pane
bg = "dark-gray"           # the "code box" — makes code read as code, not prose

[link]
fg = "light-blue"          # spliced links on a page — unboxed, distinct from the code box

# Reader find (the `f` key in Read mode): the needle's occurrences are boxed.
# `find_match` is the softer box (every hit); `find_current` is the strong
# box (the selected hit the viewport centers on). Distinct hues (cyan vs
# yellow) so a hit list is scannable.
[find_match]
fg = "black"
bg = "light-cyan"

[find_current]
fg = "black"
bg = "yellow"
