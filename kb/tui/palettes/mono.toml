# Mono: every role is `fg` only (no bg), `dim`/`hint` use the terminal's
# native dim modifier, and `selection` uses `reverse`. Exists to prove that
# the *symbols* (▸ ▮ » ◆ ◇ · !), not the color, carry the meaning — a user
# who runs in a terminal with a fixed 2-color palette (or prints the TUI)
# can still read every screen.

[label]
fg   = "white"
bold = true

[default]
fg = "white"

[dim]
fg  = "white"
dim = true

[active]
fg   = "white"
bold = true                # ▸ distinguishes it

[caret]
fg   = "white"
bold = true

[hint]
fg  = "white"
dim = true

[gated]
fg   = "white"
bold = true                # ◆

[open]
fg  = "white"
dim = true                 # ◇

[info]
fg = "white"

[success]
fg   = "white"
bold = true

[error]
fg   = "white"
bold = true                # ! + bold

[selection]
reverse = true

[selection_ctx]
reverse = true
