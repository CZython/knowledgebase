# Colorblind-safe: no red/green pair anywhere. Red → Magenta, Green →
# Blue/Cyan. Meaning is *also* double-encoded via the symbols that are
# hard-coded in render.rs (▸ / ▮ / » / ◆ / ◇ / · / !), so the palette is
# strictly a recolor and the semantic survives even in monochrome.

[label]
fg   = "cyan"
bold = true

[default]
fg = "white"

[dim]
fg = "dark-gray"

[active]
fg   = "cyan"
bold = true                # ▸

[caret]
fg   = "white"
bold = true                # ▮

[hint]
fg = "dark-gray"

[gated]
fg   = "blue"
bold = true                # ◆ (has search_required_phrase)

[open]
fg = "dark-gray"           # ◇ (no gate)

[info]
fg = "cyan"

[success]
fg = "blue"                # was green

[error]
fg   = "magenta"
bold = true                # was red

[selection]
fg = "black"
bg = "white"

[selection_ctx]
fg = "white"
bg = "dark-gray"

[md_bold]
fg   = "yellow"
bold = true                # **bold** in the read pane (yellow, not red/green)

[md_italic]
fg     = "light-cyan"
italic = true              # *italic* / _italic_ in the read pane

[md_strike]
fg            = "dark-gray"
strikethrough = true       # ~~strikethrough~~ in the read pane

[md_code]
fg = "white"               # `code` in the read pane
bg = "dark-gray"           # the "code box" — makes code read as code, not prose

# Reader find (the `f` key in Read mode). Cyan (matches) vs magenta
# (the current/selected hit) — both distinct from the red/green families
# and from each other in hue, so a hit list stays scannable under CVD.
[find_match]
fg = "black"
bg = "light-cyan"

[find_current]
fg = "black"
bg = "light-magenta"
