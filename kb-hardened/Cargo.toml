# kb-hardened — the headless CLI (agent build)
#
# The *same* shared CLI body as `kb-user` (via `include!("../kb/main.rs")`),
# but compiled with both the `tui` and `editor` features **off** by default,
# so in the standard hardened build:
#   - the `kb tui` subcommand never exists → clap rejects `kb-hardened tui` as
#     `unrecognized subcommand: 'tui'` (stderr, exit 2);
#   - the `-e` / `--edit` / `section edit` surface is compiled out
#     (`#[cfg(feature = "editor")]` in the shared body);
#   - ratatui + crossterm + unicode-width do not appear in the dependency
#     tree at all (`cargo tree -p kb-hardened`);
#   - `--version` prints `0.1.0 [hardened]` (see `kb/main.rs`).
#
# Everything else (search/browse/tag/create/section/...) is unchanged and
# available for script-driven agents (pipe-able, deterministic).
# See HARDENED_BUILD.md for the full design + why two packages.
[package]
name = "kb-hardened"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "kb-hardened — the headless, agent-facing build of `kb`: no TUI, no $EDITOR fork surface, everything pipe-able and deterministic. Package `kb-hardened`, binary `kb-hardened`."

[lints]
# Inherit the workspace lint levels verbatim (`unsafe_code = "forbid"`).
workspace = true

[features]
# The hardened build *is* the agent-facing build (MCP.md open decision #2,
# resolved 2026-11-27), so it ships the full read + write MCP surface AND
# keeps it hidden from `--help`/completions — the same posture T2 shipped.
# These are three orthogonal compile features (see `kb/mcp` in main.rs):
#   mcp        — surface exists: `kb mcp serve` works, serde_json links
#   mcp-writes — + the write handlers (implies mcp)
#   mcp-hidden — cosmetic: hides `kb mcp` from --help + completions (implies mcp)
# Turning `mcp-hidden` off gives the same working surface, just visible in --help.
default = ["mcp-writes", "mcp-hidden"]
# The remaining surfaces stay OFF by default. Toggling them on is allowed
# (e.g. `cargo build -p kb-hardened --features tui`) — the shared body then
# compiles in the same way as `kb-user` does.
editor = []
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width", "dep:serde", "dep:toml"]
# Shell-completion surface (`kb-hardened complete bash|zsh`). OFF by default
# (headless/agent builds don't complete shells); toggling it on pulls in
# `clap_complete` and compiles the `Complete` verb.
completions = ["dep:clap_complete"]
# `kb mcp serve` (MCP.md). A stdio JSON-RPC server over the same DB / SQL as
# every other verb. This is **presence**: the subcommand, the dispatch, and
# `serde_json` all compile in. `serde_json` (and `serde` which it pulls in)
# are pure-Rust, no socket: the no-network gate (gate.sh stage 8) asserts the
# `NEEDED` + dynsym properties on the mcp build, so it can never quietly drag
# a network stack into the binary.
mcp = ["dep:serde_json"]
# The write half of the MCP surface (create / section_* / replace / patch).
# Implies `mcp` so a build can never enable writes without the read surface
# they ride on. Compiling out `--no-default-features` is the only way to get
# a build without the write handlers at all.
mcp-writes = ["mcp"]
# Purely cosmetic: flips `hide` on the `Cmd::Mcp` variant so it stays out of
# `--help` and `clap_complete`'s script. The command still works regardless —
# hiddenness is an orthogonal, independently-toggleable concern from presence.
# Implies `mcp` since there is nothing to hide otherwise.
mcp-hidden = ["mcp"]

[[bin]]
name = "kb-hardened"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# `kb-hardened complete` — same gate as kb-user, OFF by default in the
# headless build (see [features]).
clap_complete = { workspace = true, optional = true }
kb-core = { workspace = true }
kb-db   = { workspace = true }
dirs    = { workspace = true }
# TUI-only, optional, pulled in only if a caller enables `--features tui`.
# With the default (headless) build they stay out of the dependency tree.
ratatui   = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
# Render.rs (shared with the `kb-user` build) measures rows in display cells;
# needs this only when `tui` is on — the default hardened build never links it.
unicode-width = { workspace = true, optional = true }
# `--palette` support (P1): `toml` parses the palette TOML files and
# `serde` + `serde_derive` give structured deserialization of `StyleSpec`
# and `Palette` (kb/tui/palette.rs). Feature-gated behind `tui` so a
# hardened build never links them — mirrors `kb-user` exactly.
serde = { workspace = true, optional = true }
toml  = { workspace = true, optional = true }
# MCP (see `mcp` / `mcp-writes` features above). `serde_json` is pure
# Rust — the no-network gate (gate.sh) asserts it never grows a socket
# family and that the hardened binary's NEEDED still lists only the
# four core libs.
serde_json = { workspace = true, optional = true }
