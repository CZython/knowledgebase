# Release — build every platform's artifact and cut a GitHub Release.
#
#   UNSTABLE : fires on every push to `main` (i.e. every merge that lands).
#              Cuts a *pre-release* at a dated, unique tag, so each merge
#              produces a fresh downloadable build ("latest nightly").
#   STABLE   : fires on a `v*` tag push. Cuts a normal (non-prerelease)
#              release at that exact tag.
#
# Each platform builds *natively* on its own OS (C build-deps must compile
# against that platform's libc):
#   linux   → static musl single binaries (distro-agnostic, no FUSE, no libs)
#   windows → native -pc-windows-msvc .exe (MSVC ships on the windows runner)
name: release

on:
  push:
    branches: [ main ]   # unstable
    tags: [ 'v*' ]       # stable

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  # Guard: a STABLE release is only ever cut from a commit that is on `main`.
  # An unstable (branch) push is inherently on main, so the gate passes for
  # that case too. ~zero seconds: a couple of `git` lookups.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the ref is cut from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            COMMIT="$(git rev-list -n 1 "$TAG")"
            if git merge-base --is-ancestor "$COMMIT" origin/main; then
              echo "stale tag $TAG — commit $COMMIT is on main — proceeding"
            else
              echo "::error::tag $TAG is not reachable from main (commit $COMMIT); no release."
              exit 1
            fi
          else
            [[ "${GITHUB_REF_NAME}" == "main" ]] || {
              echo "::error::branch push from ${GITHUB_REF_NAME} (must be main)"; exit 1; }
            echo "unstable build from main — proceeding"
          fi

  build:
    needs: [ gate ]
    strategy:
      # Independent platforms: one flaky toolchain (e.g. an MSVC bump) should
      # not sink the whole release. Each platform verifies + uploads its own
      # assets regardless of the others.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-linux-musl
            script: ./dist/build-linux.sh
          - os: windows-latest
            name: x86_64-pc-windows
            script: ./dist/build-windows.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Linux prereqs (musl target + musl C compiler)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build + stage artifacts (dist/)
        shell: bash
        run: ${{ matrix.script }}

      - name: Smoke test (version + index + search)
        shell: bash
        run: |
          set -eu
          case "${{ matrix.name }}" in
            x86_64-pc-windows) BIN="dist/kb-${{ matrix.name }}.exe" ;;
            *)                 BIN="dist/kb-${{ matrix.name }}" ;;
          esac
          "$BIN" --version
          D="$(mktemp -d)"
          printf -- '---\ntype: note\ntitle: CI Check\n---\nhello from ci\n' > "$D/a.md"
          "$BIN" add "$D" --db "$D/kb.db"
          "$BIN" search ci --db "$D/kb.db"

      # STABLE: publish at the pushed tag (e.g. v1.2.3), not a prerelease.
      - name: Upload assets → stable release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_notes: true
          files: |
            dist/kb-${{ matrix.name }}*
            dist/kb-hardened-${{ matrix.name }}*

      # UNSTABLE: compute a dated, unique rolling tag so each merge to main
      # is a fresh, addressable "nightly" build.
      - name: Compute unstable tag
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          TAG="unstable-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "unstable tag: $TAG"
        id: unstable

      - name: Upload assets → unstable (prerelease)
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.unstable.outputs.value }}
          prerelease: true
          generate_notes: true
          files: |
            dist/kb-${{ matrix.name }}*
            dist/kb-hardened-${{ matrix.name }}*
