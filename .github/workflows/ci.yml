# CI — runs on every push/PR. Mirrors `gate.sh` 7/7: build, one-pkg, clippy,
# tests, the Verus "proven-core" verification (now in the `verus-verify` job),
# and a static-musl Linux build so the release artifact is exercised on every
# PR, not just at release time.
name: ci

on:
  # Both branches are PR-gated (see setup-branch-protection.sh / CODEOWNERS).
  # `ci` must also run on direct pushes to `dev` so its required-check status
  # is always available to the branch-protection rule.
  push:
    branches: [ main, dev ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      # `gate.sh`'s stages 1-4 (build, one-pkg, clippy -D warnings, tests),
      # plus stage 7 (dep tree). Stage 5 (the Verus "proven-core" guarantee)
      # lives in the separate `verus-verify` job below, which provisions its
      # own Verus + z3 4.16.0 (the CI runner doesn't ship either by default).
      - name: Stage 1 — build both binaries
        run: cargo build

      - name: Stage 2 — single-package builds
        run: |
          cargo build -p kb-user
          cargo build -p kb-hardened

      - name: Stage 3a — cargo fmt --check
        run: cargo fmt --all -- --check
      - name: Stage 3b — clippy -D warnings (all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Stage 4 — test
        run: cargo test --workspace

      - name: Stage 7 — dep tree check (hardened is TUI-free)
        run: |
          set -e
          ! cargo tree -p kb-hardened | grep -qiE 'ratatui|crossterm' \
            || { echo "kb-hardened still links ratatui/crossterm" >&2; exit 1; }
          cargo tree -p kb-user | grep -qiE 'ratatui' \
            || { echo "kb-user is missing ratatui (should have it)" >&2; exit 1; }
          echo "dep-tree OK"

  # Linux release artifact must be buildable on every PR so a musl C-toolchain
  # (zstd et al.) drift is caught early rather than at release time.
  linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: musl C compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build (static musl)
        run: ./dist/build-linux.sh

  # gate.sh stage 5 — the "proven core" guarantee: run the Verus proofs over
  # kb-core/spec/*.rs via z3. This repo's spec corpus is verified by the
  # *standalone* `verus` binary (NOT `cargo verus`), which ships its own vstd
  # (and a z3 4.16.0 in the release bundle), so we just pin a release tarball,
  # put it on PATH, and let the repo's own `./verify.sh` do the rest — the
  # exact command a dev box runs. z3 is pinned to 4.16.0 verbatim; the Verus
  # release bundles a z3 of that same version so no extra download is needed.
  verus-verify:
    runs-on: ubuntu-latest
    # The pinned Verus release binary *hard-requires* the exact rustc it was
    # built against (1.99.1) — a rustup-managed toolchain it resolves via
    # `rustup`. The workflow-level `RUSTUP_TOOLCHAIN: stable` env would point
    # it at a *different* compiler, so this job scopes it to the exact pin
    # (job-level env overrides workflow-level). If the verus release pin
    # changes, change these two `1.99.1`s together.
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@v4

      # rustup just needs to *have* 1.99.1 installed for the verus launcher
      # to resolve it. `components` stay minimal — the binary ships its own
      # compiler companion (rust_verify); we do not compile with this rustc.
      - name: Install Rust 1.99.1 (exact toolchain the Verus release requires)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1

      - name: Install Verus (pinned release)
        run: |
          set -eu
          # Pin to the release that `kb-core/spec` is proven against. Bump
          # only after re-running the whole spec corpus locally + on CI, and
          # re-verifying that the proof obligations still discharge.
          VERUS_VER="0.2026.11.02.8bf68ee"
          URL="https://github.com/verus-lang/verus/releases/download/release/$VERUS_VER/verus-$VERUS_VER-x86-linux.zip"
          curl -fsSL -o /tmp/verus.zip "$URL"
          mkdir -p /opt/verus
          (cd /opt/verus && unzip -q /tmp/verus.zip)
          chmod +x /opt/verus/verus-x86-linux/verus
          # sanity: the binary must report the exact pinned version
          /opt/verus/verus-x86-linux/verus --version
          # PATH update applies to subsequent steps only.
          echo "/opt/verus/verus-x86-linux" >> "$GITHUB_PATH"
          echo "verus installed at: /opt/verus/verus-x86-linux/verus (on PATH from next step)"

      # Let verify.sh discover this z3 (a z3 4.16.0 the Verus release ships)
      # rather than falling back to a distro z3.
      - name: Verify z3 4.16.0
        run: |
          set -eu
          Z3=/opt/verus/verus-x86-linux/z3
          [ -x "$Z3" ] || { echo "expected $Z3 from the Verus release bundle"; exit 1; }
          Z3V="$("$Z3" --version)"
          echo "z3: $Z3V"
          case "$Z3V" in *4.16.0*) : ;; *) echo "expected z3 4.16.0, got: $Z3V"; exit 1 ;; esac
          echo "VERUS_Z3_PATH=$Z3" >> "$GITHUB_ENV"

      # The repo's own entrypoint: verifies all 15 spec files with z3, then
      # runs the `cargo test` drift-check suite. Mirrors gate.sh stage 5.
      - name: Run verify.sh (15 proofs + drift-check tests)
        run: ./verify.sh
