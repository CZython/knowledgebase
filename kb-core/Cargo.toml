[package]
name = "kb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
#
# NOTE (PLAN.md §10): this crate is the *proven* half of the project.
# It should never depend on std IO, rusqlite, or clap. Any future
# addition to this crate must stay in the "pure, no side-effects" zone
# that Verus can discharge.
[dependencies]
vstd = { workspace = true }

# Tell `cargo verus` this crate is a verification target
[package.metadata.verus]
verify = true

[lints.rust]
# The `verus_only` cfg is turned on by Verus during verification; rustc
# will warn about the unknown cfg otherwise. Mirrors the scaffold the
# Verus toolchain generates (see `cargo verus new --lib out`).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
