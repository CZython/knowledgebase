# kb-user — the full CLI (default build)
#
# A thin wrapper around the shared CLI body at `../kb/main.rs`:
#   - enables both `editor` and `tui` features;
#   - depends on ratatui + crossterm (the TUI-only crates);
#   - exposes binary `kb`.
#
# The *package* is `kb-user` (matches its directory and is the unit of
# `cargo build -p / cargo install`), but the *binary* is `kb` — the short,
# mnemonic name a person actually types. This is the same separation as
# `fd-find` (package) vs `fd` (binary), or `ripgrep` vs `rg`.
#
# The shared body is NOT a package of its own (no Cargo.toml in `kb/`);
# it is included via `include!` from this one-line `src/main.rs`. Because
# features are package-global, both variants (user / hardened) need to live
# in separate packages that share the same body file. See HARDENED_BUILD.md.
[package]
name = "kb-user"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "kb — the full knowledge-base CLI (interactive TUI + $EDITOR flow + every verb): search, browse, and section/patch edits over a Markdown corpus in SQLite/FTS5. Package `kb-user`, binary `kb`."

[lints]
# Inherit the workspace lint levels verbatim (`unsafe_code = "forbid"`).
workspace = true

[features]
default = ["editor", "tui"]
editor = []
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width", "dep:serde", "dep:toml"]

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
kb-core = { workspace = true }
kb-db   = { workspace = true }
dirs    = { workspace = true }
# The CLI writes SQL directly against `Db.conn` (a `rusqlite::Connection`),
# so it needs the crate for `params!` / `OptionalExtension` / the FTS5
# `snippet`/`bm25` functions — matching `kb-db`'s own dep (same bundled
# build, one SQLite in the tree).
rusqlite = { workspace = true }
# M8 — the TUI shell (assumed, like clap/rusqlite). Only the `kb` binary
# links these; `kb-core` + `kb-db` stay TUI-free so the verified/assumed
# boundary stays visible in the crate graph (PLAN §9/§10).
# Optional + feature-gated behind `tui` (see [features]): a hardened
# build strips the whole TUI surface and these deps from the tree.
ratatui   = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
# Display-width measurement for the TUI's bounded browse rows — used only
# when the `tui` feature is on (render.rs), so a hardened build never links it.
 unicode-width = { workspace = true, optional = true }
 # `--palette` support (P1): `toml` parses the user/palette TOML files and
 # `serde` + `serde_derive` give us structured deserialization of `StyleSpec`
 # and `Palette` with `deny_unknown_fields`. Feature-gated behind `tui` so a
 # hardened build never links them.
 serde   = { workspace = true, optional = true }
 toml    = { workspace = true, optional = true }